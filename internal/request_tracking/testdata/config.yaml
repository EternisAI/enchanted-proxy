model_router:
  providers:
  - name: OpenAI
    api_key_env_var: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  models:
  - name: openai/gpt-5.5-pro
    aliases:
    - gpt-5.5-pro
    token_multiplier: 54.0
    min_tier: pro
    providers:
    - name: OpenAI
      model: gpt-5.5-pro

  - name: openai/gpt-4o
    aliases:
    - gpt-4o
    providers:
    - name: OpenAI
      model: gpt-4o
